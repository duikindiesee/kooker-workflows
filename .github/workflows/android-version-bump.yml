# =============================================================================
# android-version-bump.yml
# =============================================================================
# PURPOSE
#   Reusable workflow that automatically bumps the Android app version in
#   build.gradle based on the triggering commit message (Conventional Commits).
#
# VERSIONING SCHEME
#   versionName follows semver: MAJOR.MINOR.PATCH
#   versionCode = MAJOR*100 + MINOR*10 + PATCH  (stays in sync and readable)
#
#   Examples:
#     1.0.0  → versionCode 100
#     1.1.0  → versionCode 110
#     1.1.1  → versionCode 111
#     2.0.0  → versionCode 200
#
# BUMP RULES (Conventional Commits — Option C)
#   Commit prefix      → Bump type → Example
#   ────────────────── ─────────── ──────────────────────
#   fix:               → PATCH     →  1.0.0 → 1.0.1
#   feat:              → MINOR     →  1.0.0 → 1.1.0  (resets PATCH to 0)
#   feat!: or
#   BREAKING CHANGE    → MAJOR     →  1.0.0 → 2.0.0  (resets MINOR+PATCH to 0)
#   chore/docs/ci/
#   refactor/test      → NO BUMP   →  version unchanged
#
# LOOP PREVENTION
#   The bump step writes a commit with message "chore(release): bump X to Y".
#   The next CI run detects this prefix and skips bumping — preventing
#   an infinite bump loop. The build continues normally in the same run.
#
# USAGE (in calling workflow)
#   jobs:
#     version-bump:
#       uses: duikindiesee/kooker-workflows/.github/workflows/android-version-bump.yml@<commit-sha>
#       with:
#         app-dir: sportifine          # subdirectory inside the repo
#       secrets: inherit
#
#     build:
#       needs: version-bump
#       # refer to bumped version: ${{ needs.version-bump.outputs.new-version }}
#
# REQUIRED PERMISSIONS (in calling workflow)
#   permissions:
#     contents: write
# =============================================================================

name: Android Version Bump (Conventional Commits)

on:
  workflow_call:
    inputs:
      app-dir:
        description: |
          Subdirectory containing the Android project, relative to the repo root.
          Must contain an 'app/build.gradle' file with versionName and versionCode.
          Example: 'sportifine', 'sprout', 'otto'
        required: true
        type: string

    outputs:
      new-version:
        description: "The versionName after the bump (or unchanged if no bump needed)"
        value: ${{ jobs.bump.outputs.new-version }}
      new-version-code:
        description: "The versionCode after the bump (MAJOR*100 + MINOR*10 + PATCH)"
        value: ${{ jobs.bump.outputs.new-version-code }}
      bumped:
        description: "'true' if a version bump was committed, 'false' otherwise"
        value: ${{ jobs.bump.outputs.bumped }}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    # Uses the proven kooker1-org self-hosted pool (see org-runner-canary.yml in kooker-infra and
    # maven-version-bump.yml/ghcr-retention.yml/gitops-sync.yml in this repo) -- not the retired
    # [self-hosted, local-linux] label this job was moved off of.
    runs-on: [self-hosted, Linux, X64, kooker1-org, docker]
    permissions:
      contents: write  # needed to push the bump commit back to the branch

    outputs:
      new-version:      ${{ steps.bump.outputs.new-version }}
      new-version-code: ${{ steps.bump.outputs.new-version-code }}
      bumped:           ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Checkout (full history for push)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect bump type and apply version
        id: bump
        shell: bash
        env:
          APP_DIR: ${{ inputs.app-dir }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_DIR="${APP_DIR%/}"
          if [ -z "$APP_DIR" ] || [[ ! "$APP_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$APP_DIR" == /* ]] || [[ "$APP_DIR" == -* ]] || [[ "$APP_DIR" == ~* ]] || [[ "$APP_DIR" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::Invalid app-dir '$APP_DIR': must be a clean relative directory path without '..' or leading '-'/'/'."
            exit 1
          fi

          COMMIT_SUBJECT="$(printf '%s' "${COMMIT_MSG}" | sed -n '1p')"
          BUILD_GRADLE="${APP_DIR}/app/build.gradle"
          if [ ! -f "$BUILD_GRADLE" ] || [ -L "$BUILD_GRADLE" ]; then
            echo "::error::Gradle build file missing or symlinked: '${BUILD_GRADLE}'."
            exit 1
          fi

          printf '=== Commit  : %s\n' "${COMMIT_SUBJECT}"
          printf '=== App dir : %s\n' "${APP_DIR}"
          printf '=== Gradle  : %s\n' "${BUILD_GRADLE}"

          parse_semver() {
            local ver="$1"
            if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid semver versionName '${ver}' in '${BUILD_GRADLE}' (expected MAJOR.MINOR.PATCH)." >&2
              exit 1
            fi
          }

          CURRENT="$(grep -E "^\s+versionName" "$BUILD_GRADLE" | head -n1 | grep -oP "['\"]\K[^'\"]+" || true)"
          if [ -z "$CURRENT" ]; then
            echo "ERROR: Could not parse versionName from ${BUILD_GRADLE}" >&2
            exit 1
          fi
          parse_semver "$CURRENT"

          MAJOR="$(printf '%s\n' "$CURRENT" | cut -d. -f1)"
          MINOR="$(printf '%s\n' "$CURRENT" | cut -d. -f2)"
          PATCH="$(printf '%s\n' "$CURRENT" | cut -d. -f3)"

          # ──────────────────────────────────────────────────────────────────
          # LOOP GUARD
          # If this commit is itself a release bump (pushed by this workflow),
          # skip bumping. The build continues using the already-bumped version.
          # ──────────────────────────────────────────────────────────────────
          if printf '%s\n' "$COMMIT_MSG" | grep -qE "^chore\(release\):"; then
            echo "Release commit detected — skipping bump to prevent infinite loop."
            {
              echo "new-version=${CURRENT}"
              echo "new-version-code=$(( MAJOR * 100 + MINOR * 10 + PATCH ))"
              echo "bumped=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Current: ${CURRENT}  (versionCode: $(( MAJOR * 100 + MINOR * 10 + PATCH )))"

          # ──────────────────────────────────────────────────────────────────
          # DETERMINE BUMP TYPE from Conventional Commit prefix
          # ──────────────────────────────────────────────────────────────────
          BUMP_TYPE="none"
          if printf '%s\n' "$COMMIT_MSG" | grep -qiE "(^feat!|^feat\([^)]+\)!|BREAKING CHANGE)"; then
            BUMP_TYPE="major"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP_TYPE="minor"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qE "^fix(\([^)]+\))?:"; then
            BUMP_TYPE="patch"
          fi

          if [ "$BUMP_TYPE" = "none" ]; then
            echo "No version bump for prefix: ${COMMIT_SUBJECT}"
            {
              echo "new-version=${CURRENT}"
              echo "new-version-code=$(( MAJOR * 100 + MINOR * 10 + PATCH ))"
              echo "bumped=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ──────────────────────────────────────────────────────────────────
          # CALCULATE NEW VERSION
          # ──────────────────────────────────────────────────────────────────
          case $BUMP_TYPE in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_CODE=$(( MAJOR * 100 + MINOR * 10 + PATCH ))
          echo "New: ${NEW_VERSION}  (versionCode: ${NEW_CODE})  bump: ${BUMP_TYPE}"

          # ──────────────────────────────────────────────────────────────────
          # WRITE NEW VERSION into build.gradle (supports single and double quotes)
          # Only touches versionName and versionCode lines; preserves everything else.
          # ──────────────────────────────────────────────────────────────────
          sed -i -E "s/(versionName[[:space:]]+)['\"][^'\"]*['\"]/\1'${NEW_VERSION}'/" "$BUILD_GRADLE"
          sed -i -E "s/(versionCode[[:space:]]+)[0-9]+/\1${NEW_CODE}/" "$BUILD_GRADLE"

          UPDATED_NAME="$(grep -E "^\s+versionName" "$BUILD_GRADLE" | head -n1 | grep -oP "['\"]\K[^'\"]+" || true)"
          if [ "$UPDATED_NAME" != "$NEW_VERSION" ]; then
            echo "::error::Failed to update versionName to '${NEW_VERSION}' in '${BUILD_GRADLE}'."
            exit 1
          fi

          # ──────────────────────────────────────────────────────────────────
          # COMMIT AND PUSH
          # The "chore(release):" prefix is the loop guard for the next run.
          # ──────────────────────────────────────────────────────────────────
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$BUILD_GRADLE"
          git commit --only -m "chore(release): bump ${APP_DIR} to ${NEW_VERSION}" -- "$BUILD_GRADLE"
          if [ -n "${GH_TOKEN:-}" ]; then
            ASKPASS_SCRIPT="$(mktemp)"
            trap 'rm -f "$ASKPASS_SCRIPT"' EXIT
            chmod 700 "$ASKPASS_SCRIPT"
            cat > "$ASKPASS_SCRIPT" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'x-access-token\n' ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
            GIT_ASKPASS="$ASKPASS_SCRIPT" GIT_TERMINAL_PROMPT=0 git push
          else
            git push
          fi

          {
            echo "new-version=${NEW_VERSION}"
            echo "new-version-code=${NEW_CODE}"
            echo "bumped=true"
          } >> "$GITHUB_OUTPUT"
