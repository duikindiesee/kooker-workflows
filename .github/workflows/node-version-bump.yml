# =============================================================================
# node-version-bump.yml  (v1.5.8)
# =============================================================================
# PURPOSE
#   Reusable workflow that automatically bumps the npm package.json version on
#   every merge to main. Used by all Node/frontend services:
#     - kooker-web
#     - sportifine-v2
#     - kooker-api-specs
#
# VERSIONING SCHEME
#   Follows standard SemVer 2.0.0: MAJOR.MINOR.PATCH
#   Every non-release merge to main triggers at minimum a PATCH bump.
#
# BUMP RULES (Conventional Commits)
#   Commit prefix      → Bump type → Example
#   ────────────────── ─────────── ──────────────────────
#   feat!: / BREAKING  → MAJOR     →  1.0.3 → 2.0.0
#   feat:              → MINOR     →  1.0.3 → 1.1.0
#   fix: / any other   → PATCH     →  1.0.3 → 1.0.4
#
# BRANCH PROTECTION COMPATIBLE (v1.5.6)
#   Cannot push directly to main — branch protection requires a PR.
#   Flow:
#     1. Feature PR merges → version-bump creates chore/bump-X.Y.Z PR
#     2. Bump PR auto-merges once quality checks pass
#     3. Second pipeline run hits loop guard → skips bump → Docker build runs
#        with new version from package.json
#
# LOOP PREVENTION
#   Bump PRs use "chore(release):" prefix. On the second run (after bump PR
#   merges), the loop guard detects this prefix and skips bumping. The Docker
#   build still runs with the already-bumped version.
#
# USAGE (in calling workflow)
#   jobs:
#     version-bump:
#       if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#       uses: duikindiesee/kooker-workflows/.github/workflows/node-version-bump.yml@<commit-sha>
#       secrets: inherit
#
#     build-and-push:
#       needs: version-bump
#       # use: needs.version-bump.outputs.new-version for Docker tag
#
# REQUIRED SECRETS
#   GITHUB_TOKEN — standard token with contents: write, pull-requests: write
#   MAVEN_PUBLISH_TOKEN — PAT used to open the bump PR so CI runs on it
#   GITOPS_APPROVER_TOKEN — separate reviewer identity for PR approval
# =============================================================================

name: Node Version Bump (Conventional Commits)

on:
  workflow_call:
    inputs:
      create-release:
        description: "Whether to create a GitHub Release immediately when a version bump PR is created. Defaults to true for backwards compatibility; downstream callers managing publication separately may pass false to opt out."
        required: false
        type: boolean
        default: true
    outputs:
      new-version:
        description: "The package.json version after the bump (or unchanged if skipped)"
        value: ${{ jobs.bump.outputs.new-version }}
      bumped:
        description: "'true' if a version bump PR was created, 'false' otherwise"
        value: ${{ jobs.bump.outputs.bumped }}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    runs-on: [self-hosted, Linux, X64, kooker1-org, docker]
    permissions:
      contents: write
      pull-requests: write

    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      bumped:      ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Checkout (full history for push)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # MAVEN_PUBLISH_TOKEN is used in create-pull-request below so the bump PR
          # triggers downstream CI. GITOPS_APPROVER_TOKEN approves it separately.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Detect bump type and write version to package.json
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SUBJECT="$(printf '%s' "${COMMIT_MSG}" | sed -n '1p')"
          printf '=== Commit: %s\n' "${COMMIT_SUBJECT}"

          validate_semver() {
            local ver="$1"
            if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid package.json version '${ver}' (expected MAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
          }

          # ──────────────────────────────────────────────────────────────────
          # LOOP GUARD
          # If this commit is a release bump PR merge, skip bumping entirely.
          # The build job will still run with the bumped version on main.
          # ──────────────────────────────────────────────────────────────────
          if printf '%s\n' "$COMMIT_MSG" | grep -qE "^chore\(release\):"; then
            echo "Release commit detected — skipping bump to prevent infinite loop."
            CURRENT="$(node -p "require('./package.json').version")"
            validate_semver "$CURRENT"
            echo "new-version=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ──────────────────────────────────────────────────────────────────
          # READ CURRENT VERSION from package.json
          # ──────────────────────────────────────────────────────────────────
          CURRENT="$(node -p "require('./package.json').version")"
          if [ -z "$CURRENT" ]; then
            echo "ERROR: Could not read version from package.json" >&2
            exit 1
          fi
          validate_semver "$CURRENT"
          MAJOR="$(printf '%s\n' "$CURRENT" | cut -d. -f1)"
          MINOR="$(printf '%s\n' "$CURRENT" | cut -d. -f2)"
          PATCH="$(printf '%s\n' "$CURRENT" | cut -d. -f3)"
          echo "Current version: ${CURRENT}"

          # ──────────────────────────────────────────────────────────────────
          # DETERMINE BUMP TYPE from Conventional Commit prefix.
          # Default to PATCH for any non-release merge (every merge bumps).
          # ──────────────────────────────────────────────────────────────────
          BUMP_TYPE="patch"
          if printf '%s\n' "$COMMIT_MSG" | grep -qiE "(^feat!|^feat\([^)]+\)!|BREAKING CHANGE)"; then
            BUMP_TYPE="major"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP_TYPE="minor"
          fi

          # ──────────────────────────────────────────────────────────────────
          # CALCULATE NEW VERSION
          # ──────────────────────────────────────────────────────────────────
          case $BUMP_TYPE in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: ${NEW_VERSION}  bump: ${BUMP_TYPE}"

          # ──────────────────────────────────────────────────────────────────
          # SKIP ALREADY-CUT VERSIONS (self-heal from version drift)
          # ──────────────────────────────────────────────────────────────────
          git fetch --tags --force --quiet || true
          while git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; do
            echo "Tag v${NEW_VERSION} already exists; advancing patch."
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "Resolved free version: ${NEW_VERSION}"

          # ──────────────────────────────────────────────────────────────────
          # WRITE NEW VERSION to package.json
          # ──────────────────────────────────────────────────────────────────
          npm version "${NEW_VERSION}" --no-git-tag-version --allow-same-version

          # ──────────────────────────────────────────────────────────────────
          # A release bump must not rewrite reviewed source or immutable fixtures.
          # ──────────────────────────────────────────────────────────────────
          if ! git diff --quiet HEAD -- . ':(exclude)package.json' ':(exclude)package-lock.json' ||
             [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Version bump changed a non-package path; refusing the release commit."
            exit 1
          fi
          if git diff --quiet HEAD -- package.json; then
            echo "::error::npm version did not change package.json; refusing the release commit."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PACKAGE_PATHS=(package.json)
          git add -- package.json
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            if [ ! -f package-lock.json ]; then
              echo "::error::Tracked package-lock.json is missing; refusing the release commit."
              exit 1
            fi
            git add -- package-lock.json
            PACKAGE_PATHS+=(package-lock.json)
          fi
          PRE_BUMP_HEAD="$(git rev-parse HEAD)"
          git commit --only -m "chore(release): bump to ${NEW_VERSION}" -- "${PACKAGE_PATHS[@]}"

          abort_bump_commit() {
            git reset --soft "$PRE_BUMP_HEAD"
            exit 1
          }
          if [ "$(git rev-parse HEAD^)" != "$PRE_BUMP_HEAD" ]; then
            echo "::error::Release commit parent changed unexpectedly; refusing publication."
            exit 1
          fi
          COMMITTED_PATHS="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ -z "$COMMITTED_PATHS" ]; then
            echo "::error::Release commit contains no changed paths."
            abort_bump_commit
          fi
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json) ;;
              *) echo "::error::Release commit contains a non-package path; refusing publication."; abort_bump_commit ;;
            esac
          done <<< "$COMMITTED_PATHS"
          if ! printf '%s\n' "$COMMITTED_PATHS" | grep -qx 'package.json' ||
             [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "::error::Release commit lacks package.json or hooks left an unclean worktree; refusing publication."
            abort_bump_commit
          fi

          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────────────
      # CREATE PR for the bump commit (branch-protection compatible)
      # ────────────────────────────────────────────────────────────────────────
      - name: Create version-bump pull request
        id: create-pr
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.MAVEN_PUBLISH_TOKEN }}
          branch: "chore/bump-${{ steps.bump.outputs.new-version }}"
          title: "chore(release): bump to ${{ steps.bump.outputs.new-version }}"
          body: |
            Automated version bump to `${{ steps.bump.outputs.new-version }}`.

            Created automatically by the CI pipeline.
            Will auto-merge once status checks pass.
          labels: "automated,version-bump"
          delete-branch: true

      - name: Enable auto-merge on bump PR
        if: steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number '$PR_NUMBER'."
            exit 1
          fi
          set +e
          OUTPUT=$(gh pr merge "$PR_NUMBER" \
            --auto --squash \
            --repo "${GITHUB_REPOSITORY}" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "Auto-merge enabled on PR #${PR_NUMBER}"
          elif printf '%s\n' "$OUTPUT" | grep -q "Protected branch rules not configured"; then
            echo "::warning::Auto-merge skipped — no branch protection rules configured. Bump PR must be merged manually."
          else
            echo "::error::Auto-merge failed unexpectedly: $OUTPUT"
            exit 1
          fi
        env:
          # Reuse the existing PR-author token so merged pushes can trigger CI.
          # Separate approval and branch protection remain unchanged.
          GH_TOKEN: ${{ secrets.MAVEN_PUBLISH_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}

      - name: Approve bump PR (separate approver identity)
        if: steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_APPROVER_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number '$PR_NUMBER'."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITOPS_APPROVER_TOKEN is not set. Bump PR #${PR_NUMBER} opened but cannot be approved; it will stall under branch protection and the bumps will pile up."
            exit 1
          fi
          gh pr review "$PR_NUMBER" \
            --approve \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Automated version bump. Approved by the separate approver identity so the armed auto-merge can complete under branch protection."

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true' && inputs.create-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          set -euo pipefail
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$NEW_VERSION'."
            exit 1
          fi
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::warning::Release v${NEW_VERSION} already exists; skipping creation."
          else
            gh release create "v${NEW_VERSION}" \
              --title "Release v${NEW_VERSION}" \
              --generate-notes
          fi
