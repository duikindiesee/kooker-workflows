# =============================================================================
# maven-version-bump.yml
# =============================================================================
# PURPOSE
#   Reusable workflow that automatically bumps the Maven project version in
#   pom.xml based on the triggering commit message (Conventional Commits).
#   Used by all Spring Boot backend services:
#     - kooker-service-user
#     - kooker-service-auth
#     - kooker-gateway
#     - kooker-service-image
#
# VERSIONING SCHEME
#   Follows standard SemVer 2.0.0: MAJOR.MINOR.PATCH (no -SNAPSHOT; CI manages clean versions)
#   A standard PATCH bump occurs if changes exist in db/migration/*.sql or commit contains flyway keyword,
#   even if the commit prefix implies no bump (e.g. chore).
#
#   Examples:
#     1.0.3 + fix:    → 1.0.4
#     1.0.3 + feat:   → 1.1.0  (PATCH resets to 0)
#     1.0.3 + feat!   → 2.0.0  (MINOR+PATCH reset to 0)
#     1.0.3 + flyway  → 1.0.4  (PATCH incremented)
#
# BUMP RULES (Conventional Commits)
#   Commit prefix      → Bump type → Example
#   ────────────────── ─────────── ──────────────────────
#   fix:               → PATCH     →  1.0.3 → 1.0.4
#   feat:              → MINOR     →  1.0.3 → 1.1.0
#   feat!: or
#   BREAKING CHANGE    → MAJOR     →  1.0.3 → 2.0.0
#   (db schema change) → PATCH     →  1.0.3 → 1.0.4
#   chore/docs/ci/
#   refactor/test      → PATCH     →  1.0.3 → 1.0.4 (every merge to main bumps)
#
# LOOP PREVENTION
#   Bump commits use "chore(release):" prefix, detected on the next CI run
#   to skip bumping. The Docker build continues in the same workflow run.
#
# USAGE (in calling workflow)
#   jobs:
#     version-bump:
#       uses: duikindiesee/kooker-workflows/.github/workflows/maven-version-bump.yml@<commit-sha>
#       with:
#         java-version: '25'         # optional, default is '25'
#       secrets: inherit
#
#     build:
#       needs: version-bump
#       # version: ${{ needs.version-bump.outputs.new-version }}
#
# REQUIRED PERMISSIONS (in calling workflow)
#   permissions:
#     contents: write
#
# REQUIRED SECRETS
#   MAVEN_PUBLISH_TOKEN — PAT for reading from GitHub Packages (kooker-parent-build)
#   GITOPS_APPROVER_TOKEN — separate reviewer identity for PR approval under branch protection
# =============================================================================

name: Maven Version Bump (Conventional Commits)

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use for mvn help:evaluate and versions:set. Default: '25'."
        required: false
        type: string
        default: '25'

    outputs:
      new-version:
        description: "The Maven project version after the bump (or unchanged if no bump)"
        value: ${{ jobs.bump.outputs.new-version }}
      bumped:
        description: "'true' if a version bump was committed, 'false' otherwise"
        value: ${{ jobs.bump.outputs.bumped }}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    runs-on: [self-hosted, Linux, X64, kooker1-org, docker]
    permissions:
      contents: write
      pull-requests: write  # needed to push the bump commit back to the branch

    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      bumped:      ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_JAVA_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::java-version must be a positive integer, got '$INPUT_JAVA_VERSION'."
            exit 1
          fi

      - name: Checkout (full history for push)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK (needed for mvn help:evaluate and versions:set)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MAVEN_PUBLISH_TOKEN || github.token }}

      - name: Detect bump type and apply version
        id: bump
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MAVEN_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT_SUBJECT="$(printf '%s' "${COMMIT_MSG}" | sed -n '1p')"
          printf '=== Commit: %s\n' "${COMMIT_SUBJECT}"

          validate_semver() {
            local ver="$1"
            if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid project.version '${ver}' (expected MAJOR.MINOR.PATCH)." >&2
              exit 1
            fi
          }

          # ──────────────────────────────────────────────────────────────────
          # LOOP GUARD
          # If this commit is itself a release bump, skip to prevent infinite loop.
          # ──────────────────────────────────────────────────────────────────
          if printf '%s\n' "$COMMIT_MSG" | grep -qE "^chore\(release\):"; then
            echo "Release commit detected — skipping bump to prevent infinite loop."
            RAW="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -1)"
            CURRENT="${RAW%-SNAPSHOT}"
            validate_semver "$CURRENT"
            echo "new-version=${CURRENT}" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ──────────────────────────────────────────────────────────────────
          # READ CURRENT VERSION from pom.xml via Maven (handles parent poms,
          # property interpolation, multi-module layouts correctly).
          # Strips -SNAPSHOT if present.
          # ──────────────────────────────────────────────────────────────────
          RAW="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -1)"
          CURRENT="${RAW%-SNAPSHOT}"
          if [ -z "$CURRENT" ]; then
            echo "ERROR: Could not read project.version from pom.xml" >&2
            exit 1
          fi
          validate_semver "$CURRENT"
          MAJOR="$(printf '%s\n' "$CURRENT" | cut -d. -f1)"
          MINOR="$(printf '%s\n' "$CURRENT" | cut -d. -f2)"
          PATCH="$(printf '%s\n' "$CURRENT" | cut -d. -f3)"
          echo "Current version: ${CURRENT}"

          # ──────────────────────────────────────────────────────────────────
          # DETERMINE BUMP TYPE from Conventional Commit prefix.
          # RULE: Every non-release merge to main triggers at minimum PATCH.
          # ──────────────────────────────────────────────────────────────────
          BUMP_TYPE="patch"
          if printf '%s\n' "$COMMIT_MSG" | grep -qiE "(^feat!|^feat\([^)]+\)!|BREAKING CHANGE)"; then
            BUMP_TYPE="major"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP_TYPE="minor"
          elif git diff-tree --no-commit-id --name-only -r HEAD | grep -q 'db/migration/.*\.sql$'; then
            BUMP_TYPE="patch"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qiE "(flyway|dbmigration|db-migration)"; then
            BUMP_TYPE="patch"
          fi
          echo "Bump type: ${BUMP_TYPE}"

          # ──────────────────────────────────────────────────────────────────
          # CALCULATE NEW VERSION
          # ──────────────────────────────────────────────────────────────────
          case $BUMP_TYPE in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: ${NEW_VERSION}  bump: ${BUMP_TYPE}"

          # ──────────────────────────────────────────────────────────────────
          # SKIP ALREADY-CUT VERSIONS (self-heal from version drift)
          # ──────────────────────────────────────────────────────────────────
          git fetch --tags --force --quiet || true
          while git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; do
            echo "Tag v${NEW_VERSION} already exists; advancing patch."
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "Resolved free version: ${NEW_VERSION}"

          # ──────────────────────────────────────────────────────────────────
          # WRITE NEW VERSION to all pom.xml files via Maven Versions Plugin.
          # ──────────────────────────────────────────────────────────────────
          mvn -B versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false

          # ──────────────────────────────────────────────────────────────────
          # SYNC OPENAPI SPEC VERSION (if present)
          # ──────────────────────────────────────────────────────────────────
          SPEC_FILE="postman/specs/openapi.yaml"
          if [ -f "${SPEC_FILE}" ]; then
            sed -i "s/^  version: .*/  version: ${NEW_VERSION}/" "${SPEC_FILE}"
            git add -- "${SPEC_FILE}"
            echo "Also bumped ${SPEC_FILE} to ${NEW_VERSION}"
          fi

          # ──────────────────────────────────────────────────────────────────
          # Verify only pom.xml / openapi.yaml were modified before committing
          # ──────────────────────────────────────────────────────────────────
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Version bump created unexpected untracked files; refusing release commit."
            exit 1
          fi
          while IFS= read -r changed_path; do
            [ -z "$changed_path" ] && continue
            case "$changed_path" in
              pom.xml|*/pom.xml|postman/specs/openapi.yaml) ;;
              *)
                echo "::error::Version bump modified unexpected path '$changed_path'; refusing release commit."
                exit 1
                ;;
            esac
          done < <(git diff --name-only HEAD)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -name "pom.xml" -not -path "./.git/*" -exec git add -- {} +

          PRE_BUMP_HEAD="$(git rev-parse HEAD)"
          if [ "$BUMP_TYPE" = "patch" ] && git diff-tree --no-commit-id --name-only -r HEAD | grep -q 'db/migration/.*\.sql$'; then
            git commit -m "chore(release): bump to ${NEW_VERSION} [db-migration]"
          else
            git commit -m "chore(release): bump to ${NEW_VERSION}"
          fi

          abort_bump_commit() {
            git reset --soft "$PRE_BUMP_HEAD"
            exit 1
          }
          COMMITTED_PATHS="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [ -z "$COMMITTED_PATHS" ]; then
            echo "::error::Release commit contains no changed paths."
            abort_bump_commit
          fi
          while IFS= read -r path; do
            case "$path" in
              pom.xml|*/pom.xml|postman/specs/openapi.yaml) ;;
              *)
                echo "::error::Release commit contains unexpected path '$path'; refusing publication."
                abort_bump_commit
                ;;
            esac
          done <<< "$COMMITTED_PATHS"

          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────
      # CREATE PR — branch protection compatible
      # ──────────────────────────────────────────────────────────────────────
      - name: Create version-bump pull request
        id: create-pr
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "chore/bump-${{ steps.bump.outputs.new-version }}"
          title: "chore(release): bump to ${{ steps.bump.outputs.new-version }}"
          body: |
            Automated version bump to `${{ steps.bump.outputs.new-version }}`.

            Created automatically by the CI pipeline.
            Will auto-merge once status checks pass.
          labels: "automated,version-bump"
          delete-branch: true

      - name: Enable auto-merge on bump PR
        if: steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number '$PR_NUMBER'."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" \
            --auto --squash \
            --repo "${GITHUB_REPOSITORY}"
          echo "Auto-merge enabled on PR #${PR_NUMBER}"

      - name: Approve bump PR (separate approver identity)
        if: steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_APPROVER_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number '$PR_NUMBER'."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITOPS_APPROVER_TOKEN is not set. Bump PR #${PR_NUMBER} opened but cannot be approved; it will stall under branch protection and jam the release pipeline."
            exit 1
          fi
          gh pr review "$PR_NUMBER" \
            --approve \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Automated version bump. Approved by the separate approver identity so the armed auto-merge can complete under branch protection."

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          set -euo pipefail
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$NEW_VERSION'."
            exit 1
          fi
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::warning::Release v${NEW_VERSION} already exists; skipping creation."
          else
            gh release create "v${NEW_VERSION}" \
              --title "Release v${NEW_VERSION}" \
              --generate-notes
          fi
