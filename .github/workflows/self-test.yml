# =============================================================================
# self-test.yml
# =============================================================================
# PURPOSE
#   This repository ships reusable workflows and shared scripts consumed by
#   every other duikindiesee Maven repository — it has no build of its own to
#   run on push/PR. This workflow is that missing "build": it runs this
#   repo's own script test suites (currently just
#   tests/check-jdk25-baseline.test.sh) on every push and pull request, so a
#   regression in a shared guard is caught here, once, before it can ever
#   reach a consuming repo.
# =============================================================================

name: Self Test

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  script-tests:
    runs-on: [self-hosted, Linux, X64, kooker1-org, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25 baseline guard — fixture test suite
        run: bash tests/check-jdk25-baseline.test.sh

      - name: Adoption lock guard and GitOps workflow regression suite
        run: bash tests/check-adoption-lock.test.sh

      - name: Set up Node.js for version-bump contract tests
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Node version-bump package-only regression suite
        run: bash tests/check-node-version-bump.test.sh

      - name: Node bump merge-trigger identity and mocked shell controls
        run: node tests/check-node-merge-trigger.cjs

      - name: Install pinned test-only dependencies for workflow contract tests
        run: npm ci --prefix tests

      - name: Node bump release creation opt-out contract and expression controls
        run: node tests/check-node-release-optout.cjs

      - name: GHCR centralized retention tag-protection regression suite
        run: node tests/check-ghcr-retention.test.cjs

      - name: Set up Kustomize for GitOps integration tests
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1

      - name: GitOps digest supplementary contract checks (D01-D22 static/copied parsers)
        run: node tests/check-gitops-digest.test.cjs

      - name: GitOps digest runtime regression suite (actual production steps and consumer CLI)
        run: node tests/check-gitops-digest-integration.cjs
